services:
  ping-itor:
    build:
      context: .
      args:
        VERSION: "${VERSION:-dev}"
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ping-itor-data:/data
    environment:
      DATABASE_PATH: /data/ping-itor.db
      HTTP_ADDR: :8080
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: "587"
      SMTP_USER: resend
      SMTP_PASS: ${RESEND_API_KEY}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TO: ${SMTP_TO}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ping-itor-data:
